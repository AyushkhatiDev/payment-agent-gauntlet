[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gauntlet"
version = "0.1.0"
description = "Adversarial safety test harness for payment agents (Razorpay MCP)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Gauntlet Team" }
]
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "razorpay>=2.0.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    "anthropic>=0.30.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
gauntlet = "gauntlet.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gauntlet"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
